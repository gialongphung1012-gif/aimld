<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>{% block title %}AIMLD Admin{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="top"><a class="brand" href="{{ url_for('admin.dashboard') }}"><span class="logo">A</span><span>AIMLD<small>LICENSE CONTROL</small></span></a>{% if session.get('admin_id') %}<div class="user"><span>{{ session.get('username') }}</span><form method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn ghost" type="submit">Đăng xuất</button></form></div>{% endif %}</header><main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static',filename='app.js') }}" defer></script></body></html>
